name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [k8s/kustomization.yaml]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: rrchnm-systems/reusable-workflows/.forgejo/workflows/hermetic-test.yml@e67acce3544dd67cf10562ab965cbd99c8262c80 # pinned; bump deliberately
    with:
      cache-image: rrchnm/apiary-django
  image:
    needs: test
    permissions:
      contents: write
    uses: rrchnm-systems/reusable-workflows/.forgejo/workflows/oci-image.yml@e67acce3544dd67cf10562ab965cbd99c8262c80 # pinned; bump deliberately
    secrets: inherit
    with:
      image: rrchnm/apiary-django
      context: .
      overlay: k8s
      pull-request-build: true
