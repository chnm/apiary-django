- model: apiary.project
  pk: 4
  fields:
    name: Religious Ecologies
    app_label: relec
    description: >
      American Religious Ecologies is a project of the Roy Rosenzweig Center
      for History and New Media that is creating new datasets,
      maps and visualizations for the history of American religion.
      With the generous support of the National Endowment for the Humanities,
      we are currently digitizing the 1926 U.S. Census of Religious Bodies,
      which has individual schedules for approximately 232,000 congregations.
      We are also investigating denominational records and other sources of data.
