---
name: apiary-django

services:
  app:
    build: .
    image: "rrchnm/apiary-django"
    ports:
      - 8000:8000
    volumes:
     #- dj-data:/app
      - .:/app
    environment: &app-env
      - DEBUG=True
      - DJANGO_LOG_LEVEL=DEBUG
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      # Pages are served on their own host; *.localhost resolves to loopback.
      - PAGES_HOST=pages.localhost
      - PAGES_BASE_URL=http://pages.localhost:8000
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost
      - DJANGO_SUPERUSER_EMAIL=PLACEHOLDER
      - DJANGO_SUPERUSER_USERNAME=PLACEHOLDER
      - DJANGO_SUPERUSER_PASSWORD=PLACEHOLDER
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=apiary-django
      - DB_USER=apiary-django
      - DB_PASS=password
      - ALLAUTH_ORCID_CLIENT_ID=PLACEHOLDER
      - ALLAUTH_ORCID_CLIENT_SECRET=PLACEHOLDER
      - ALLAUTH_GITHUB_CLIENT_ID=PLACEHOLDER
      - ALLAUTH_GITHUB_CLIENT_SECRET=PLACEHOLDER
      - ALLAUTH_SLACK_CLIENT_ID=PLACEHOLDER
      - ALLAUTH_SLACK_CLIENT_SECRET=PLACEHOLDER
      - OBJ_STORAGE=True
      - OBJ_STORAGE_ACCESS_KEY_ID=PLACEHOLDER
      - OBJ_STORAGE_SECRET_ACCESS_KEY=PLACEHOLDER
      - OBJ_STORAGE_BUCKET_NAME=PLACEHOLDER
      - OBJ_STORAGE_ENDPOINT_URL=https://dev.obj.rrchnm.org
    command: >
        sh -c "uv run manage.py migrate --database=default --verbosity=1 &&
               uv run manage.py loaddata projects.yaml --database=default --verbosity=1 &&

               uv run manage.py migrate bom --database=bom_db --verbosity=1 &&
               uv run manage.py loaddata mortalities.json --database=bom_db --verbosity=1 &&

               uv run manage.py migrate connthreads --database=connthreads_db --verbosity=1 &&
               uv run manage.py loaddata textiles.json --database=connthreads_db --verbosity=1 &&

               uv run manage.py migrate mappingviolence --database=mappingviolence_db --verbosity=1 &&
               uv run manage.py loaddata witnesses.json --database=mappingviolence_db --verbosity=1 &&

               uv run manage.py migrate relec --database=relec_db --verbosity=1 &&
               uv run manage.py loaddata denominations.json --database=relec_db --verbosity=1 &&
               uv run manage.py loaddata schedules.json --database=relec_db --verbosity=1 &&

               uv run manage.py migrate pinkertons --database=pinkertons_db --verbosity=1 &&
               uv run manage.py loaddata activities.json --database=pinkertons_db --verbosity=1 &&

               uv run manage.py init_project_groups && 
               uv run manage.py loaddata users.yaml --database=default --verbosity=1 &&
               uv run manage.py init_superuser && 
               uv run manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
  # Read-only MCP server for AI agents (apiary/mcp_server.py), at
  # http://localhost:8001/mcp with an API token from the admin.
  mcp:
    image: "rrchnm/apiary-django"
    ports:
      - 8001:8001
    volumes:
      - .:/app
    environment: *app-env
    command: uv run uvicorn apiary.mcp_server:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      app:
        condition: service_started
  db:
    image: postgres:18
    ports:
      - 5432:5432
    volumes:
      - ./postgres_initdb:/docker-entrypoint-initdb.d
      - pg-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=apiary-django
      - POSTGRES_USER=apiary-django
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiary-django"]
      interval: 2s
      timeout: 5s
      retries: 3

volumes:
  dj-data:
  pg-data:
