apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apiary
resources:
- quota.yaml
- netpol.yaml
- externalsecret.yaml
- postgres.yaml
- migrate.yaml
- app.yaml
- httproute.yaml
configMapGenerator:
- literals:
  - DEBUG=False
  - DB_HOST=postgres
  - DB_PORT=5432
  - DB_NAME=apiary-django
  - DB_USER=apiary-django
  - BOM_DB_PATH=/data/bom.sqlite3
  - OBJ_STORAGE=True
  - OBJ_STORAGE_ENDPOINT_URL=http://obj.rrchnm.internal:3900
  - OBJ_STORAGE_REGION=rrchnm
  - OBJ_STORAGE_BUCKET_NAME=workspaces.apiary.rrchnm.org
  - DJANGO_ALLOWED_HOSTS=workspaces.apiary.rrchnm.org
  - DJANGO_CSRF_TRUSTED_ORIGINS=https://workspaces.apiary.rrchnm.org
  name: apiary-env
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
# CI replaces this bootstrap digest. Do not activate Argo before the first build.
images:
- digest: sha256:968d344ef17acf0713ad460628eb48f646ca3ac7b8cbaa0300321cb05f2690eb
  name: oci.rrchnm.internal/rrchnm/apiary-django
