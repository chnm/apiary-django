apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apiary
resources:
- quota.yaml
- netpol.yaml
- externalsecret.yaml
- postgres.yaml
- migrate.yaml
- app.yaml
- httproute.yaml
configMapGenerator:
- literals:
  - DEBUG=False
  - DB_HOST=postgres
  - DB_PORT=5432
  - DB_NAME=apiary-django
  - DB_USER=apiary-django
  - BOM_DB_PATH=/data/bom.sqlite3
  - OBJ_STORAGE=True
  - DJANGO_ALLOWED_HOSTS=workspaces.apiary.rrchnm.org
  - DJANGO_CSRF_TRUSTED_ORIGINS=https://workspaces.apiary.rrchnm.org
  name: apiary-env
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
# CI replaces this bootstrap digest. Do not activate Argo before the first build.
images:
- digest: sha256:bb74d580194d48a6379ba262ec839f46233265c6f644986954c9e1326f85bab2
  name: oci.rrchnm.internal/rrchnm/apiary-django
