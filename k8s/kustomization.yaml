apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apiary

resources:
- app-deploy.yaml
- sqlite.yaml
- mcp-route.yaml
- netpol.yaml

# Shared Django deployment: https://forge.rrchnm.internal/rrchnm-systems/k8s-django
# Pinned by commit; bump every ref together. Media lives in Garage, so no
# media component.
components:
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/app?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/postgres?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/backup?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/developer-refresh?ref=c3efe70804ed626b87b1bdfd4e59826357d82864

# This app's own Django settings (the components set DB_*, hosts and DEBUG).
configMapGenerator:
- literals:
  - BOM_DB_PATH=/data/bom.sqlite3
  - PINKERTONS_DB_PATH=/data/pinkertons.sqlite3
  - OBJ_STORAGE=True
  - OBJ_STORAGE_ENDPOINT_URL=http://obj.rrchnm.internal:3900
  - OBJ_STORAGE_REGION=rrchnm
  - OBJ_STORAGE_BUCKET_NAME=workspaces.apiary.rrchnm.org
  name: app-env
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"

  # One replica on node-local SQLite: never two writers. Move BOM to PostgreSQL
  # before scaling horizontally.
  # Project schemas + the SQLite projects, then the idempotent superuser bootstrap.
  # 02:45 ET, before the 03:30 canary and forge runs. Also back up the
  # BOM and Pinkertons SQLite files: SQLite's online backup API on a read-only open (Django's SQLite
  # backend uses the rollback journal, so a reader needs no -shm file), checked
  # with integrity_check, using the app's own image.
# 05:45 ET: after the 02:45 backup, and clear of the canary's 05:15 refresh on
# the same developer Postgres. The copy holds PostgreSQL only; the SQLite projects are not copied.
# The component's sanitize.sql covers users, sessions, allauth and the admin
# log; app tables (relec contributor names included) are copied as-is.
            # Read-only MCP for AI agents (apiary/mcp_server.py): the SDK's
            # ASGI app under uvicorn while Django stays on Gunicorn. In this pod
            # because it reads the SQLite files on the node-local sqlite volume.
            # Its env and envFrom are copied from the app container (replacements).
            # Read-only MCP for AI agents (apiary/mcp_server.py): the SDK's
            # ASGI app under uvicorn while Django stays on Gunicorn. In this pod
            # because it reads the SQLite files on the node-local sqlite volume.
            # Its env and envFrom are copied from the app container (replacements).
            # Read-only MCP for AI agents (apiary/mcp_server.py): the SDK's
            # ASGI app under uvicorn while Django stays on Gunicorn. In this pod
            # because it reads the SQLite files on the node-local sqlite volume.
            # Its env and envFrom are copied from the app container (replacements).
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: app }
    spec:
      strategy: { type: Recreate, rollingUpdate: null }
      template:
        spec:
          containers:
            - name: app
              readinessProbe: { timeoutSeconds: 5 }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
              volumeMounts:
                - { name: sqlite, mountPath: /data }
            # Read-only MCP for AI agents (apiary/mcp_server.py): the SDK's
            # ASGI app under uvicorn while Django stays on Gunicorn. In this pod
            # because it reads the SQLite files on the node-local sqlite volume.
            # Its env and envFrom are copied from the app container (replacements).
            - name: mcp
              image: app
              command: ["uvicorn", "apiary.mcp_server:app", "--host", "0.0.0.0", "--port", "8001",
                        "--no-server-header", "--timeout-graceful-shutdown", "10"]
              ports:
                - { name: mcp, containerPort: 8001 }
              readinessProbe:
                tcpSocket: { port: mcp }
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                tcpSocket: { port: mcp }
                initialDelaySeconds: 15
                periodSeconds: 30
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 384Mi }
              volumeMounts:
                - { name: sqlite, mountPath: /data }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: sqlite
              persistentVolumeClaim: { claimName: sqlite }
  target:
    kind: Deployment
    name: app
- patch: |-
    apiVersion: v1
    kind: Service
    metadata: { name: app }
    spec:
      ports:
        - { name: mcp, port: 8001, targetPort: mcp, protocol: TCP }
  target:
    kind: Service
    name: app
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata: { name: migrate }
    spec:
      template:
        spec:
          containers:
            - name: migrate
              command: ["sh", "-c", "python manage.py migrate_projects && python manage.py init_superuser"]
              resources:
                requests: { cpu: 50m, memory: 192Mi }
                limits: { cpu: "1", memory: 512Mi }
              volumeMounts:
                - { name: sqlite, mountPath: /data }
          volumes:
            - name: sqlite
              persistentVolumeClaim: { claimName: sqlite }
  target:
    kind: Job
    name: migrate
- patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 10Gi
  target:
    kind: StatefulSet
    name: postgres
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata: { name: postgres-backup }
    spec:
      schedule: "45 2 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              initContainers:
                - name: sqlite
                  image: app
                  command: ["python", "-c"]
                  args:
                    - |
                      import sqlite3
                      for name in ("bom.sqlite3", "pinkertons.sqlite3"):
                          src = sqlite3.connect(f"file:/data/{name}?mode=ro", uri=True)
                          dst = sqlite3.connect(f"/dump/{name}")
                          src.backup(dst)
                          ok = dst.execute("PRAGMA integrity_check").fetchone()[0]
                          if ok != "ok":
                              raise SystemExit(f"{name} copy failed integrity_check: {ok}")
                          print(f"[backup] {name} copied, integrity ok")
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    runAsGroup: 10001
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities: { drop: [ALL] }
                  resources:
                    requests: { cpu: 50m, memory: 64Mi }
                    limits: { cpu: 500m, memory: 256Mi }
                  volumeMounts:
                    - { name: sqlite, mountPath: /data, readOnly: true }
                    - { name: dump, mountPath: /dump }
              volumes:
                - name: sqlite
                  persistentVolumeClaim: { claimName: sqlite, readOnly: true }
  target:
    kind: CronJob
    name: postgres-backup
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata: { name: developer-refresh }
    spec:
      schedule: "45 5 * * *"
  target:
    kind: CronJob
    name: developer-refresh

# Copy the pinned digest into IMAGE_DIGEST and the developer-copy record. Must
# live here: replacements in components run before `images:` below. The MCP
# container's env copies come last, so they include IMAGE_DIGEST. The /mcp
# route takes the app route's hostnames and gateway.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=app].image
    kind: Deployment
    name: app
    options:
      delimiter: '@'
      index: 1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=app].env.[name=IMAGE_DIGEST].value
    select:
      kind: Deployment
      name: app
- source:
    fieldPath: spec.template.spec.containers.[name=app].image
    kind: Deployment
    name: app
  targets:
  - fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=swap].env.[name=APP_IMAGE].value
    select:
      kind: CronJob
      name: developer-refresh
- source:
    fieldPath: spec.template.spec.containers.[name=app].env
    kind: Deployment
    name: app
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=mcp].env
    options:
      create: true
    select:
      kind: Deployment
      name: app
- source:
    fieldPath: spec.template.spec.containers.[name=app].envFrom
    kind: Deployment
    name: app
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=mcp].envFrom
    options:
      create: true
    select:
      kind: Deployment
      name: app
- source:
    fieldPath: spec.hostnames
    kind: HTTPRoute
    name: app
  targets:
  - fieldPaths:
    - spec.hostnames
    select:
      kind: HTTPRoute
      name: mcp
- source:
    fieldPath: spec.parentRefs
    kind: HTTPRoute
    name: app
  targets:
  - fieldPaths:
    - spec.parentRefs
    select:
      kind: HTTPRoute
      name: mcp

# Two entries on purpose: `app` -> the real name, then the real name -> its
# digest. CI (chnm/.github update-deploy-digests) pins with
# `kustomize edit set image` and only updates an entry named after the real
# image. Keep that the only `digest:` line.
images:
- name: app
  newName: oci.rrchnm.internal/rrchnm/apiary-django
- digest: sha256:f9bbf1777c152e6238d6efbabba6fc8e4071607bcd210e5158b54e7b4d61f335
  name: oci.rrchnm.internal/rrchnm/apiary-django
