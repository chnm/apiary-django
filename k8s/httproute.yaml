---
# Campus-only: the k0s HAProxy tier allowlists this FQDN
# (infra ansible/vars/services-kubernetes.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apiary
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs:
    - group: gateway.networking.k8s.io   # explicit (API-server default) so Argo doesn't perma-diff
      kind: Gateway
      name: public
      namespace: platform
      sectionName: https
  hostnames:
    - workspaces.apiary.rrchnm.org
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: apiary
          port: 80
          weight: 1
