---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apiary-quota
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "4"
    requests.memory: 1Gi
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: apiary-limits
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 500m, memory: 512Mi }
      min: { cpu: 10m, memory: 16Mi }
      max: { cpu: "2", memory: 2Gi }
