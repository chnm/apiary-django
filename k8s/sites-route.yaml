# Static sites (apiary.sites), each on its own host <name>.sites.rrchnm.org,
# so sites share an origin neither with the app nor with each other. The app
# serves them only for these hosts, with the sites-only URLconf. parentRefs are
# copied from the app route (kustomization.yaml). Needs the wildcard SAN on
# the platform public-tls certificate, wildcard DNS and the edge entry
# (rrchnm-systems/infra).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sites
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs: []
  hostnames: ["*.sites.rrchnm.org"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { group: "", kind: Service, name: app, port: 80, weight: 1 }
