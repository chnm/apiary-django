---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bom
  # Same wave as the migration consumer: local-path waits for a scheduled pod.
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiary
  labels: { app: apiary }
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  # ponytail: one replica on node-local SQLite; move BOM to PostgreSQL before horizontal scaling.
  replicas: 1
  selector:
    matchLabels: { app: apiary }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: apiary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apiary
          image: oci.rrchnm.internal/rrchnm/apiary-django
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: apiary-env }
            - secretRef: { name: apiary-django }
          readinessProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - { name: Host, value: workspaces.apiary.rrchnm.org }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          # Database outages remove readiness, not liveness.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: bom, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bom
          persistentVolumeClaim: { claimName: bom }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: apiary
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app: apiary }
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
