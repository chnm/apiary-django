# /mcp and its OAuth authorization server (apiary.mcp_oauth) to the MCP
# container (Service port 8001); Django serves only the consent page. Routes of
# their own, not rules in the component's app route, and never edited in
# place: the gitops ignoreDifferences for HTTPRoute covers fields inside
# .spec.rules[], and with RespectIgnoreDifferences an apply keeps the live
# rules list, so a changed rule never lands. Change a route by adding a new
# one under a new name. The gateway prefers these longer paths over app's /.
# Hostnames and parentRefs are copied from the app route (kustomization.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
      backendRefs:
        - { group: "", kind: Service, name: app, port: 8001, weight: 1 }
---
# The authorization server's metadata and endpoints, and the protected
# resource metadata for /mcp.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-oauth
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path: { type: PathPrefix, value: /.well-known/oauth-protected-resource }
        - path: { type: Exact, value: /.well-known/oauth-authorization-server }
        - path: { type: Exact, value: /authorize }
        - path: { type: Exact, value: /token }
        - path: { type: Exact, value: /register }
        - path: { type: Exact, value: /revoke }
      backendRefs:
        - { group: "", kind: Service, name: app, port: 8001, weight: 1 }
