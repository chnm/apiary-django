---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apiary-django
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: apiary-django }
  # Preserve S3/OAuth credentials without placing them in the repository.
  dataFrom:
    - extract: { key: eso/apiary-django }
