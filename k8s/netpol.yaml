---
# The app's own outbound services. DNS + same-namespace isolation and the
# backup egress come from the k8s-django components.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-services
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  # Also the migrate Job (data migrations can touch object storage: 0006 moves
  # site files), the nightly backup (it copies the bucket into restic) and the
  # parked restore Job (it uploads the bucket back). Without this egress their
  # storage calls hang until the Job's deadline.
  endpointSelector:
    matchExpressions:
      - { key: "k8s:app", operator: In, values: [app, migrate, postgres-backup, postgres-restore] }
  egress:
    # Garage S3 API nodes (obj.rrchnm.internal); plaintext on the internal LAN.
    - toCIDRSet:
        - cidr: 10.112.113.223/32   # brahma
        - cidr: 10.112.12.225/32    # vishnu
        - cidr: 10.112.12.224/32    # shiva
      toPorts:
        - ports: [{ port: "3900", protocol: TCP }]
    - toFQDNs:
        - { matchName: orcid.org }
        - { matchName: api.orcid.org }
        - { matchName: pub.orcid.org }
        - { matchName: github.com }
        - { matchName: api.github.com }
        - { matchName: slack.com }
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
