---
# The app's own outbound services. DNS + same-namespace isolation and the
# backup egress come from the k8s-django components.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-services
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  endpointSelector:
    matchLabels:
      k8s:app: app
  egress:
    # Garage S3 API nodes (obj.rrchnm.internal); plaintext on the internal LAN.
    - toCIDRSet:
        - cidr: 10.112.113.223/32   # brahma
        - cidr: 10.112.12.225/32    # vishnu
        - cidr: 10.112.12.224/32    # shiva
      toPorts:
        - ports: [{ port: "3900", protocol: TCP }]
    - toFQDNs:
        - { matchName: orcid.org }
        - { matchName: api.orcid.org }
        - { matchName: pub.orcid.org }
        - { matchName: github.com }
        - { matchName: api.github.com }
        - { matchName: slack.com }
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
