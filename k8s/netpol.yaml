---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apiary-isolation
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns: [{ matchPattern: "*" }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apiary
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apiary-external-services
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  endpointSelector:
    matchLabels:
      k8s:app: apiary
  egress:
    - toFQDNs:
        - { matchName: dev.obj.rrchnm.org }
        - { matchName: orcid.org }
        - { matchName: api.orcid.org }
        - { matchName: pub.orcid.org }
        - { matchName: github.com }
        - { matchName: api.github.com }
        - { matchName: slack.com }
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
