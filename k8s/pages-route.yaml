# The former shared host for static sites: it now serves an index and
# redirects /<project>/<site>/ to each site's own host (sites-route.yaml). parentRefs are copied from the app route (kustomization.yaml). The
# name needs a SAN on the platform public-tls certificate and DNS to the edge
# (rrchnm-systems/infra).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pages
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs: []
  hostnames: [pages.apiary.rrchnm.org]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { group: "", kind: Service, name: app, port: 80, weight: 1 }
