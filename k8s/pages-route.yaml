# Static sites (apiary.pages) on their own host: the app serves them only for
# this Host, with the pages-only URLconf, so a page never shares the app's
# origin. parentRefs are copied from the app route (kustomization.yaml). The
# name needs a SAN on the platform public-tls certificate and DNS to the edge
# (rrchnm-systems/infra).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pages
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs: []
  hostnames: [pages.apiary.rrchnm.org]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { group: "", kind: Service, name: app, port: 80, weight: 1 }
