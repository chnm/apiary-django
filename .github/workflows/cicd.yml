name: Django CI and k0s deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [k8s/kustomization.yaml]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment:
    permissions:
      contents: write   # the reusable pins the digest back to this repository
    uses: chnm/.github/.github/workflows/django--k0s.yml@@3ba45c85c59682e7b0acade498f880cd9ab0186f # pinned; bump deliberately
    with:
      image: rrchnm/apiary-django
    secrets:
      ZOT_TOKEN: ${{ secrets.ZOT_TOKEN }}
