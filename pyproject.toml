[project]
name = "apiary-django"
version = "0.1.0"
description = ""
authors = [
    {name = "Jason Heppler",email = "jason.heppler@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django ~= 6.1.1",
    "djangorestframework ~= 3.18.1",
    "django-allauth ~= 65.19.7",
    "django-import-export ~= 4.4.1",
    "django-reversion ~= 6.3.0",
    "django-debug-toolbar ~= 8.0.0",
    "django-cors-headers ~= 4.9.0",
    "django-extensions ~= 4.1",
    "django-unfold ~= 0.108.0",
    "django-autocomplete-light ~= 5.0.0",
    "drf-spectacular ~= 0.30.0",
    "requests ~= 2.34.2",
    "django-environ ~= 0.14.0",
    "django-storages ~= 1.14.6",
    "boto3 ~= 1.43.106",
    "psycopg[binary] ~= 3.3.6",
    "gunicorn ~= 26.2.0",
    "whitenoise ~= 6.12.0",
    # StageX ships no system zoneinfo, so Python needs the tz database as a package.
    "tzdata >= 2026.4",
]

[dependency-groups]
dev = [
    "pytest-django ~= 4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apiary.settings.test"
python_files = ["tests.py", "test_*.py"]
